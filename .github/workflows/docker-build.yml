name: Docker Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to yuan180/oopzbot on Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: yuan180
  DOCKERHUB_IMAGE: yuan180/oopzbot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker-build / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    env:
      PUBLISH_IMAGE: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish docker]')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Compose and Nginx
        run: |
          docker compose config
          mkdir -p nginx/ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem
          docker run --rm \
            --add-host bot:127.0.0.1 \
            --add-host netease-api:127.0.0.1 \
            -v "$PWD/nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t

      - name: Build image
        run: |
          docker build --pull --platform linux/${{ matrix.arch }} -t oopzbot:test \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .

      - name: Verify non-root Chromium runtime
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          docker run --rm -i --network none --shm-size=1g \
            -e PYTHONPATH=/app/src -e EXPECTED_MACHINE \
            --entrypoint python oopzbot:test - <<'PY'
          import os
          import platform
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from core.browser_launch import VOICE_STREAM_ARGS

          assert platform.machine() == os.environ["EXPECTED_MACHINE"], platform.machine()
          assert os.getuid() == 1000, os.getuid()
          assert os.getgid() == 1000, os.getgid()
          assert os.environ["PLAYWRIGHT_BROWSERS_PATH"] == "/ms-playwright"
          assert Path.home() == Path("/home/bot"), Path.home()
          for variable in (
              "HOME",
              "XDG_CACHE_HOME",
              "XDG_CONFIG_HOME",
              "XDG_DATA_HOME",
              "XDG_RUNTIME_DIR",
          ):
              directory = Path(os.environ[variable])
              assert directory.is_dir(), (variable, directory)
              probe = directory / ".oopzbot-write-test"
              probe.write_text(variable, encoding="utf-8")
              probe.unlink()

          browser_root = Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"])
          assert not list(browser_root.glob("chromium_headless_shell-*"))
          assert not list(Path("/var/lib/apt/lists").glob("*_Packages*"))
          from voice_control.recognition import WakeModel
          wake_model = WakeModel("/app/plugins/voice_control/models/vosk-model-small-en-us-0.15")
          assert wake_model.decoder() is not None
          assert Path("/app/src/oopz_sdk/assets/voice/wake_sound.mp3").is_file()
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True, channel="chromium", args=VOICE_STREAM_ARGS,
              )
              page = browser.new_page()
              page.set_content("<title>chromium-channel</title>")
              assert page.title() == "chromium-channel"
              browser.close()
              # The password-login flow uses a persistent browser context.
              import tempfile
              with tempfile.TemporaryDirectory() as profile:
                  context = playwright.chromium.launch_persistent_context(
                      profile, headless=True, executable_path=os.environ["CHROME_BIN"],
                      args=VOICE_STREAM_ARGS,
                  )
                  page = context.new_page()
                  page.set_content("<title>persistent-login</title>")
                  assert page.title() == "persistent-login"
                  context.close()
          PY

      - name: Verify host bind-mount ownership override
        run: |
          # Debian 基础镜像已有 GID 100；自定义宿主 GID 与其重合也必须能构建。
          docker build \
            --build-arg BOT_UID=12345 \
            --build-arg BOT_GID=100 \
            -t oopzbot:existing-gid .
          docker run --rm --entrypoint sh oopzbot:existing-gid -c '
            test "$(id -u)" = 12345
            test "$(id -g)" = 100
          '

          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker build \
            --build-arg BOT_UID="$host_uid" \
            --build-arg BOT_GID="$host_gid" \
            -t oopzbot:host-id .

          bind_root="$(mktemp -d)"
          trap 'rm -rf "$bind_root"' EXIT
          mkdir -p "$bind_root/config" "$bind_root/data" "$bind_root/logs"
          cp config.example.py "$bind_root/config/runtime.py"
          cp private_key.example.py "$bind_root/config/private_key.py"

          docker run --rm -i \
            -e PYTHONPATH=/app/src \
            -e EXPECTED_UID="$host_uid" \
            -e EXPECTED_GID="$host_gid" \
            -v "$bind_root/config:/app/config" \
            -v "$bind_root/data:/app/data" \
            -v "$bind_root/logs:/app/logs" \
            --entrypoint python oopzbot:host-id - <<'PY'
          import os
          from pathlib import Path
          from web.web_player_config import persist_admin_uids

          assert os.getuid() == int(os.environ["EXPECTED_UID"])
          assert os.getgid() == int(os.environ["EXPECTED_GID"])
          assert Path("/app/config.py").is_symlink()
          assert Path("/app/private_key.py").is_symlink()
          assert Path("/app/config.py").resolve() == Path("/app/config/runtime.py")
          persist_admin_uids(["docker-ci"])
          assert "docker-ci" in Path("/app/config.py").read_text(encoding="utf-8")
          assert not Path("/app/config/runtime.py.tmp").exists()
          Path("/app/private_key.py").write_text("updated-key", encoding="utf-8")
          Path("/app/config/.write-test").write_text("config", encoding="utf-8")
          Path("/app/data/.write-test").write_text("data", encoding="utf-8")
          Path("/app/logs/.write-test").write_text("logs", encoding="utf-8")
          PY

          test "$(cat "$bind_root/config/.write-test")" = config
          test "$(cat "$bind_root/data/.write-test")" = data
          test "$(cat "$bind_root/logs/.write-test")" = logs
          grep -q docker-ci "$bind_root/config/runtime.py"
          test "$(cat "$bind_root/config/private_key.py")" = updated-key
          test "$(stat -c %u "$bind_root/data/.write-test")" = "$host_uid"
          test "$(stat -c %g "$bind_root/data/.write-test")" = "$host_gid"

      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested architecture image
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          set -euo pipefail
          staging_tag="${DOCKERHUB_IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          docker tag oopzbot:test "$staging_tag"
          docker push "$staging_tag"
          mkdir -p /tmp/image-digests
          docker image inspect --format='{{index .RepoDigests 0}}' "$staging_tag" > "/tmp/image-digests/${{ matrix.arch }}.txt"

      - name: Upload tested image digest
        if: env.PUBLISH_IMAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/image-digests/*.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish-multiarch
    needs: docker-build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish docker]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download tested image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/image-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified multi-platform image
        run: |
          set -euo pipefail
          revision_tag="sha-${GITHUB_SHA:0:12}"
          amd64_digest="$(cat /tmp/image-digests/amd64.txt)"
          arm64_digest="$(cat /tmp/image-digests/arm64.txt)"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${revision_tag}" \
            "$amd64_digest" "$arm64_digest"
          docker buildx imagetools inspect --raw "${DOCKERHUB_IMAGE}:${revision_tag}" > /tmp/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("/tmp/manifest.json").read_text())
          platforms = {(m["platform"]["os"], m["platform"]["architecture"]) for m in index["manifests"]}
          assert platforms == {("linux", "amd64"), ("linux", "arm64")}, platforms
          PY
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${DOCKERHUB_IMAGE}:${revision_tag}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '## Docker Hub multi-platform image published'
            echo
            echo "- Image: \`${DOCKERHUB_IMAGE}:latest\`"
            echo "- Revision: \`${DOCKERHUB_IMAGE}:${revision_tag}\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
            echo '- Both images passed native Chromium and bind-mount permission checks.'
          } >> "$GITHUB_STEP_SUMMARY"
