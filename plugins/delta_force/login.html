<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三角洲 · 扫码登录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 10%,#164e63,transparent 60%),radial-gradient(ellipse at 90% 80%,#443175,transparent 65%),#0b1526;color:#f1f5fb;font:16px/1.7 system-ui,sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid #ffffff30;border-radius:24px;background:#132239bf;backdrop-filter:blur(24px);box-shadow:0 25px 90px #0005}small{color:#83d9d3;letter-spacing:.15em}h1{font-size:28px;margin:8px 0}p{color:#d3deed}#qr{display:block;width:240px;height:240px;max-width:100%;object-fit:contain;background:white;padding:10px;margin:24px auto;border-radius:14px}#qr[hidden]{display:none}#status{padding:14px;border-radius:12px;background:#ffffff0c;border:1px solid #ffffff20}footer{font-size:12px;color:#aebfd3;margin-top:24px}.success{color:#7ee4b0}.error{color:#ffb2b2}</style></head>
<body><main class="card"><small>DELTA FORCE / 登录</small><h1>扫码连接你的账号</h1><p id="provider">正在确认登录渠道…</p><img id="qr" alt="登录二维码"><div id="status" role="status" aria-live="polite">正在获取登录状态…</div><footer>请勿转发此临时链接。登录结果会由机器人私信通知。此页面不需要填写密码。</footer></main>
<script>
const base=location.pathname.replace(/\/$/,''), image=document.getElementById('qr'), statusBox=document.getElementById('status');
image.src=base+'/qr';let failures=0;
async function poll(){try{const response=await fetch(base+'/status',{cache:'no-store',credentials:'omit'});const data=await response.json();failures=0;document.getElementById('provider').textContent=data.provider==='wechat'?'请使用微信扫码，并在手机上确认。':'请使用 QQ 扫码，并在手机上确认。';statusBox.textContent=data.message;if(data.terminal){image.hidden=true;statusBox.className=data.state==='authenticated'?'success':'error';return;}}catch(e){failures++;statusBox.textContent='暂时无法连接，正在重试…';if(failures>=10){image.hidden=true;statusBox.textContent='连接中断，请回到机器人重新发起登录。';return;}}setTimeout(poll,2500);}poll();
</script></body></html>
